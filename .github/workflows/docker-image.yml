name: Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Login step only executed for pushes to main
      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and tag the production Docker image
      - name: Build the Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}"
          docker build . --file Dockerfile --tag "$IMAGE_NAME"
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            docker tag "$IMAGE_NAME" "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          fi

      # Push the production Docker image
      - name: Push the Docker image
        if: github.ref == 'refs/heads/master'
        run: |
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
