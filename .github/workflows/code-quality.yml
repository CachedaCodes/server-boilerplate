name: Code Quality

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use the latest stable Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Biome
        run: npx biome ci .
